name: Deploy FlixOn to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  preflight:
    name: 🔍 Pre-flight Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --production=false

      - name: Generate deployment info
        run: node scripts/generate-deployment-info.js || true

      - name: 🔨 Build Next.js (must pass to deploy)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_key' }}
          SKIP_ENV_VALIDATION: 'true'
        run: |
          npm run build
          echo "✅ Build passed — proceeding to deploy"

  deploy:
    name: 🚀 Deploy to VPS (24/7 Squeeze Engine)
    runs-on: ubuntu-latest
    needs: [preflight]

    steps:
      - name: Deploy directly to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '161.129.65.113' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            echo "========================================================"
            echo "  FlixOn 24/7 Production Deployment"
            echo "========================================================"

            # Clean up any broken symlinks from earlier tests
            if [ -L "/var/www/flixon" ]; then
              TARGET=$(readlink -f /var/www/flixon)
              echo "Resolving symlink /var/www/flixon -> $TARGET"
              rm -f /var/www/flixon
              mv "$TARGET" /var/www/flixon 2>/dev/null || true
            fi

            mkdir -p /var/www/flixon
            cd /var/www/flixon

            # Initialize git if needed
            if [ ! -d ".git" ]; then
              git clone https://github.com/derrickgenesism/flixonzero.git .
            fi

            echo "⬇️  Pulling latest code from master..."
            git fetch origin master
            git reset --hard origin/master

            # Ensure backup of .env.local
            if [ -f "/var/www/flixon/.env.local" ]; then
              cp /var/www/flixon/.env.local /var/www/.env.local.backup
            elif [ -f "/var/www/.env.local.backup" ]; then
              cp /var/www/.env.local.backup /var/www/flixon/.env.local
            fi

            echo "📋 Recording deployment metadata (Uganda EAT)..."
            node scripts/generate-deployment-info.js || true

            echo "📦 Installing dependencies..."
            npm install --production=false

            echo "🔨 Building Next.js..."
            npm run build

            echo "♻️  Starting Next.js Server on PM2..."
            pm2 delete flixon > /dev/null 2>&1 || true
            pm2 start npm --name "flixon" -- start

            echo "🗜 Ensuring FFmpeg is installed on VPS..."
            (which ffmpeg > /dev/null 2>&1) || (apt-get update -qq && apt-get install -y -qq ffmpeg || true)

            echo "⚡ Starting 24/7 Squeeze Background Compressor Engine on PM2..."
            pm2 delete flixon-compressor > /dev/null 2>&1 || true
            pm2 start scripts/compressor.js --name "flixon-compressor" --cwd /var/www/flixon --time

            pm2 save
            sleep 4

            echo "🩺 Checking PM2 status..."
            pm2 status

            echo ""
            echo "🎉 FlixOn deployment completed! Squeeze Engine is running 24/7 on the VPS."
