name: Deploy FlixOn to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip pre-deploy build check (emergency only)'
        required: false
        default: 'false'
        type: boolean

# Cancel any in-progress deploy when a new commit is pushed
concurrency:
  group: deploy-master
  cancel-in-progress: false   # never kill a mid-deploy; queue instead

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Pre-flight — build & lint check runs on GitHub (free runners)
  # If this fails, deploy never starts → site stays alive
  # ─────────────────────────────────────────────────────────────────
  preflight:
    name: 🔍 Pre-flight Build Check
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --production=false

      - name: Generate deployment info
        run: node scripts/generate-deployment-info.js || true

      - name: 🔨 Build Next.js (must pass to deploy)
        env:
          # Provide dummy env vars so Next.js build doesn't crash
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_key' }}
          SKIP_ENV_VALIDATION: 'true'
        run: |
          npm run build
          echo "✅ Build passed — proceeding to deploy"

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to VPS (only runs if preflight passed)
  # Uses blue/green swap: builds into a new folder, swaps atomically
  # Automatically rolls back if the new build fails health check
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS (Zero-Downtime + Auto-Rollback)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: always() && (needs.preflight.result == 'success' || github.event.inputs.skip_tests == 'true')

    steps:
      - name: Deploy with blue/green swap & auto-rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '161.129.65.113' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            SITE_DIR="/var/www/flixon"
            RELEASES_DIR="/var/www/flixon-releases"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            NEW_RELEASE="$RELEASES_DIR/$TIMESTAMP"
            CURRENT_LINK="$SITE_DIR"
            SHARED_ENV="$RELEASES_DIR/.shared.env.local"
            MAX_RELEASES=5

            echo "========================================================"
            echo "  FlixOn Deployment: $TIMESTAMP"
            echo "  Commit: $(cd $SITE_DIR && git rev-parse --short HEAD 2>/dev/null || echo unknown)"
            echo "========================================================"

            # ── 1. Create releases directory if first run ──────────────
            mkdir -p "$RELEASES_DIR"

            # ── 2. If this is the very first deploy, convert flat dir ──
            if [ ! -L "$CURRENT_LINK" ] && [ -d "$CURRENT_LINK/.git" ]; then
              echo "📦 First blue-green deploy: migrating flat directory..."
              INIT_RELEASE="$RELEASES_DIR/initial_$(date +%Y%m%d_%H%M%S)"
              cp -a "$CURRENT_LINK" "$INIT_RELEASE"
              # Save .env.local to shared location
              [ -f "$CURRENT_LINK/.env.local" ] && cp "$CURRENT_LINK/.env.local" "$SHARED_ENV"
              ln -sfn "$INIT_RELEASE" "$CURRENT_LINK"
              echo "✅ Migrated to: $INIT_RELEASE"
            fi

            # ── 3. Record current good release for rollback ────────────
            PREVIOUS_RELEASE=$(readlink -f "$CURRENT_LINK" 2>/dev/null || echo "")
            echo "📌 Current (rollback target): $PREVIOUS_RELEASE"

            # ── 4. Clone current release into new release slot ─────────
            echo "📂 Cloning current release to new slot: $NEW_RELEASE"
            cp -a "$PREVIOUS_RELEASE/." "$NEW_RELEASE"

            # ── 5. Pull latest code ────────────────────────────────────
            echo "⬇️  Pulling latest code..."
            cd "$NEW_RELEASE"
            git fetch origin master
            git reset --hard origin/master

            # ── 6. Restore shared .env.local ───────────────────────────
            if [ -f "$SHARED_ENV" ]; then
              cp "$SHARED_ENV" "$NEW_RELEASE/.env.local"
              echo "🔑 Restored shared .env.local"
            else
              echo "⚠️  No shared .env.local found at $SHARED_ENV — using committed env"
            fi

            # ── 7. Install dependencies ────────────────────────────────
            echo "📦 Installing dependencies..."
            npm ci --production=false 2>&1 | tail -5

            # ── 8. Build (second check on actual VPS env) ──────────────
            echo "🔨 Building Next.js on VPS..."
            npm run build
            echo "✅ VPS build passed"

            # ── 9. Atomic swap: point symlink to new release ───────────
            echo "🔄 Swapping to new release (atomic)..."
            ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"
            echo "✅ Symlink swapped to: $NEW_RELEASE"

            # ── 10. Reload PM2 (zero downtime) ─────────────────────────
            echo "♻️  Reloading FlixOn PM2 process..."
            pm2 restart flixon --update-env || (cd "$CURRENT_LINK" && pm2 start npm --name "flixon" -- start)
            sleep 4

            # ── 11. Health check (hits /api/deployment endpoint) ───────
            echo "🩺 Running health check..."
            HEALTH_URL="http://localhost:3000/api/deployment"
            HTTP_CODE=$(curl -s -o /tmp/flixon_health.json -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")

            if [ "$HTTP_CODE" != "200" ]; then
              echo ""
              echo "❌ HEALTH CHECK FAILED (HTTP $HTTP_CODE)"
              echo "🔙 AUTO-ROLLING BACK to: $PREVIOUS_RELEASE"

              ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"
              pm2 reload flixon --update-env || pm2 restart flixon --update-env
              sleep 3

              ROLLBACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
              if [ "$ROLLBACK_CODE" = "200" ]; then
                echo "✅ Rollback successful — site is back on previous version"
              else
                echo "⚠️  Rollback complete but health check returned $ROLLBACK_CODE — please check manually"
              fi

              # Clean up failed release
              rm -rf "$NEW_RELEASE"
              exit 1
            fi

            echo "✅ Health check passed (HTTP 200)"
            cat /tmp/flixon_health.json | python3 -m json.tool 2>/dev/null || cat /tmp/flixon_health.json || true

            # ── 12. Ensure compressor worker is running ─────────────────
            echo "🗜  Ensuring Squeeze compressor worker is running..."
            (which ffmpeg > /dev/null 2>&1) || (apt-get update -qq && apt-get install -y -qq ffmpeg || true)
            cd "$CURRENT_LINK"
            pm2 delete flixon-compressor > /dev/null 2>&1 || true
            pm2 start scripts/compressor.js --name "flixon-compressor" --time
            pm2 save

            # ── 13. Prune old releases (keep last MAX_RELEASES) ─────────
            echo "🧹 Pruning old releases (keeping last $MAX_RELEASES)..."
            ls -1dt "$RELEASES_DIR"/[0-9]* 2>/dev/null | tail -n +$((MAX_RELEASES + 1)) | while read old; do
              echo "   Removing old release: $old"
              rm -rf "$old"
            done

            echo ""
            echo "========================================================"
            echo "  ✅ FlixOn deployed successfully!"
            echo "  📂 Active release : $NEW_RELEASE"
            echo "  📌 Rollback target: $PREVIOUS_RELEASE"
            echo "  Run on VPS to rollback manually:"
            echo "    ln -sfn \"$PREVIOUS_RELEASE\" \"$CURRENT_LINK\""
            echo "    pm2 reload flixon"
            echo "========================================================"

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Notify on failure (Preflight OR deploy failed)
  # ─────────────────────────────────────────────────────────────────
  notify-failure:
    name: 🚨 Notify on Failure
    runs-on: ubuntu-latest
    needs: [preflight, deploy]
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "🚨 DEPLOYMENT FAILED for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Preflight: ${{ needs.preflight.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo ""
          echo "→ The site was NOT updated (or was auto-rolled back)."
          echo "→ Check GitHub Actions logs for details."
